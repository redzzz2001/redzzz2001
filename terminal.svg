<svg xmlns="http://www.w3.org/2000/svg" width="580" height="174" viewBox="0 0 580 174">
  <rect x="1" y="1" width="578" height="172" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <path d="M15 1 H565 Q579 1 579 15 V43 H1 V15 Q1 1 15 1" fill="#161b22"/>
  <path d="M1 43 H579" stroke="#30363d"/>

  <circle cx="22" cy="22" r="6" fill="#ff5f57"/>
  <circle cx="43" cy="22" r="6" fill="#febc2e"/>
  <circle cx="64" cy="22" r="6" fill="#28c840"/>

  <text x="290" y="27" font-family="monospace" font-size="13" fill="#8b949e" text-anchor="middle">redzzz@terminal</text>

  <text x="22" y="104" font-family="monospace" font-size="15" fill="#e6edf3">
    <tspan fill="#7ee787">redzzz@PC-do-nick</tspan><tspan>:~$ </tspan>
  </text>

  <defs>
    <clipPath id="typing">
      <rect x="0" y="0" width="0" height="25">
        <animate
          attributeName="width"
          calcMode="discrete"
          dur="7s"
          repeatCount="indefinite"
          keyTimes="0;0.0357;0.4357;0.6429;0.9;1"
          values="0;0;290;290;0;0"/>
      </rect>
    </clipPath>
  </defs>

  <g transform="translate(211 85)" clip-path="url(#typing)">
    <text x="0" y="19" font-family="monospace" font-size="15" fill="#e6edf3">
      hello world("print")
      <set attributeName="visibility" to="hidden" begin="7s" dur="21s" repeatCount="indefinite"/>
    </text>
  </g>

  <rect x="211" y="90" width="8" height="18" fill="#e6edf3">
    <animate
      attributeName="opacity"
      values="1;0;1"
      dur="1s"
      repeatCount="indefinite"/>
  </rect>
</svg>
