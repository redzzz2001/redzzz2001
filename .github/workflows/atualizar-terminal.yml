name: Atualizar terminal animado

on:
  push:
    branches: [main]
    paths:
      - frases.txt
      - scripts/gerar_terminal.py
      - .github/workflows/atualizar-terminal.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gerar-terminal:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Gerar SVG
        run: python scripts/gerar_terminal.py
      - name: Atualizar versao da imagem no README
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import re
          svg = Path("terminal.svg").read_bytes()
          version = hashlib.sha256(svg).hexdigest()[:12]
          readme = Path("README.md")
          original = readme.read_text(encoding="utf-8")
          updated = re.sub(r'\./terminal\.svg(?:\?v=[a-f0-9]+)?', f'./terminal.svg?v={version}', original)
          if updated == original and './terminal.svg' not in original:
              raise SystemExit("Referencia do terminal nao encontrada no README.md")
          readme.write_text(updated, encoding="utf-8")
          PY
      - name: Publicar SVG e README atualizados
        run: |
          if ! git diff --quiet -- terminal.svg README.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add terminal.svg README.md
            git commit -m "chore: sync terminal and refresh image cache"
            git push
          fi
