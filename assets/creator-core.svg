<svg xmlns="http://www.w3.org/2000/svg" width="900" height="390" viewBox="0 0 900 390" role="img" aria-labelledby="title desc">
  <title id="title">Creator process core</title><desc id="desc">Ciclo criativo animado de ideia, caos, codigo e lancamento</desc>
  <defs>
    <linearGradient id="panel" x2="1" y2="1"><stop stop-color="#11151c"/><stop offset="1" stop-color="#08090c"/></linearGradient>
    <linearGradient id="line"><stop stop-color="#ff173d" stop-opacity=".08"/><stop offset=".5" stop-color="#ff173d"/><stop offset="1" stop-color="#ff173d" stop-opacity=".08"/></linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#ff173d" stroke-opacity=".045"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="900" height="390" rx="18" fill="url(#panel)"/><rect x="1" y="1" width="898" height="388" rx="17" fill="none" stroke="#30363d" stroke-width="2"/><rect x="18" y="18" width="864" height="354" rx="12" fill="url(#grid)"/>
  <g font-family="monospace"><text x="30" y="42" fill="#ff3655" font-size="13">// CREATOR PROCESS CORE</text><text x="870" y="42" text-anchor="end" fill="#484f58" font-size="12">LOOP: INFINITE</text></g>
  <path d="M125 142H775" fill="none" stroke="#30363d" stroke-width="2"/><path d="M125 142H775" fill="none" stroke="url(#line)" stroke-width="2" stroke-dasharray="8 10"><animate attributeName="stroke-dashoffset" from="0" to="-72" dur="2s" repeatCount="indefinite"/></path>
  <circle r="7" fill="#ff173d" filter="url(#glow)"><animateMotion dur="5s" repeatCount="indefinite" path="M125 142H775"/></circle>
  <g font-family="monospace" text-anchor="middle">
    <g transform="translate(125 142)"><circle r="48" fill="#0d1117" stroke="#ff3655" stroke-width="2"/><circle r="38" fill="none" stroke="#ff173d" stroke-opacity=".22" stroke-dasharray="4 7"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="9s" repeatCount="indefinite"/></circle><text y="5" fill="#f0f6fc" font-size="15" font-weight="700">IDEA</text><text y="74" fill="#7d8590" font-size="10">01 // IGNITE</text></g>
    <g transform="translate(342 142)"><circle r="48" fill="#0d1117" stroke="#bc8cff" stroke-width="2"/><path d="M-19-7L0-22 19-7 12 19-12 19Z" fill="none" stroke="#bc8cff"><animateTransform attributeName="transform" type="rotate" values="0;18;-12;0" dur="2.4s" repeatCount="indefinite"/></path><text y="5" fill="#f0f6fc" font-size="14" font-weight="700">CHAOS</text><text y="74" fill="#7d8590" font-size="10">02 // BREAK</text></g>
    <g transform="translate(558 142)"><circle r="48" fill="#0d1117" stroke="#58a6ff" stroke-width="2"/><text y="5" fill="#f0f6fc" font-size="15" font-weight="700">CODE</text><path d="M-22-18l-12 18 12 18M22-18L34 0 22 18" fill="none" stroke="#58a6ff" stroke-width="2"><animate attributeName="stroke-opacity" values="1;.25;1" dur="1.5s" repeatCount="indefinite"/></path><text y="74" fill="#7d8590" font-size="10">03 // BUILD</text></g>
    <g transform="translate(775 142)"><circle r="48" fill="#0d1117" stroke="#3fb950" stroke-width="2"/><path d="M0-24L9-7 26 0 9 7 0 24-9 7-26 0-9-7Z" fill="#3fb950" fill-opacity=".16" stroke="#3fb950" filter="url(#glow)"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="7s" repeatCount="indefinite"/></path><text y="5" fill="#f0f6fc" font-size="13" font-weight="700">SHIP</text><text y="74" fill="#7d8590" font-size="10">04 // RELEASE</text></g>
  </g>
  <g transform="translate(30 264)" font-family="monospace"><text fill="#7d8590" font-size="11">CURRENT SIGNAL</text><g transform="translate(0 24)" font-size="16" font-weight="700"><text fill="#ff3655">CREATING SOMETHING NEW_</text></g></g>
  <g transform="translate(485 258)" font-family="monospace" font-size="10">
    <g><text fill="#7d8590">CURIOSITY</text><text x="350" text-anchor="end" fill="#ff3655">98%</text><rect y="10" width="350" height="6" rx="3" fill="#21262d"/><rect y="10" width="343" height="6" rx="3" fill="#ff173d"><animate attributeName="width" values="0;343;337;343" dur="3s" repeatCount="indefinite"/></rect></g>
    <g transform="translate(0 43)"><text fill="#7d8590">PERSISTENCE</text><text x="350" text-anchor="end" fill="#3fb950">99%</text><rect y="10" width="350" height="6" rx="3" fill="#21262d"/><rect y="10" width="346" height="6" rx="3" fill="#3fb950"><animate attributeName="width" values="0;346;340;346" dur="3.4s" repeatCount="indefinite"/></rect></g>
    <g transform="translate(0 86)"><text fill="#7d8590">SLEEP</text><text x="350" text-anchor="end" fill="#bc8cff">12%</text><rect y="10" width="350" height="6" rx="3" fill="#21262d"/><rect y="10" width="42" height="6" rx="3" fill="#bc8cff"><animate attributeName="width" values="20;42;31;42" dur="2.2s" repeatCount="indefinite"/></rect></g>
  </g>
</svg>
