name: Atualizar terminal animado

on:
  push:
    branches: [main]
    paths:
      - frases.txt
      - scripts/gerar_terminal.py
      - .github/workflows/atualizar-terminal.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gerar-terminal:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Gerar SVG
        run: python scripts/gerar_terminal.py
      - name: Publicar terminal atualizado
        run: |
          if ! git diff --quiet -- terminal.svg; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add terminal.svg
            git commit -m "chore: sync terminal.svg with frases.txt"
            git push
          fi
