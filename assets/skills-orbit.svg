<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-labelledby="title desc">
  <title id="title">Tech orbit</title><desc id="desc">Tecnologias girando ao redor do nucleo criativo Redzzz</desc>
  <defs>
    <radialGradient id="core"><stop stop-color="#ff3655" stop-opacity=".42"/><stop offset=".5" stop-color="#9f1027" stop-opacity=".15"/><stop offset="1" stop-color="#0d1117" stop-opacity="0"/></radialGradient>
    <filter id="g"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="900" height="330" rx="18" fill="#0d1117"/>
  <rect x="1" y="1" width="898" height="328" rx="17" fill="none" stroke="#30363d" stroke-width="2"/>
  <g font-family="monospace">
    <text x="28" y="38" fill="#ff3655" font-size="13">// TECHNOLOGY ORBIT</text>
    <text x="872" y="38" text-anchor="end" fill="#484f58" font-size="12">SYNC: 100%</text>
  </g>
  <g transform="translate(450 178)">
    <ellipse rx="315" ry="112" fill="none" stroke="#ff173d" stroke-opacity=".18" stroke-dasharray="5 9"/>
    <ellipse rx="220" ry="78" fill="none" stroke="#8b949e" stroke-opacity=".15"/>
    <circle r="95" fill="url(#core)"><animate attributeName="r" values="88;100;88" dur="3s" repeatCount="indefinite"/></circle>
    <circle r="52" fill="#111820" stroke="#ff173d" stroke-width="2" filter="url(#g)"/>
    <text y="-4" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="17" font-weight="700">CREATIVE</text>
    <text y="20" text-anchor="middle" fill="#ff3655" font-family="monospace" font-size="13">CORE</text>
    <g id="outer" font-family="monospace" font-size="14" text-anchor="middle">
      <g transform="translate(315 0)"><rect x="-55" y="-18" width="110" height="36" rx="18" fill="#161b22" stroke="#f1e05a"/><text y="5" fill="#f1e05a">JavaScript</text></g>
      <g transform="translate(157 97)"><rect x="-48" y="-18" width="96" height="36" rx="18" fill="#161b22" stroke="#3178c6"/><text y="5" fill="#58a6ff">TypeScript</text></g>
      <g transform="translate(-157 97)"><rect x="-38" y="-18" width="76" height="36" rx="18" fill="#161b22" stroke="#e34c26"/><text y="5" fill="#f0883e">HTML</text></g>
      <g transform="translate(-315 0)"><rect x="-36" y="-18" width="72" height="36" rx="18" fill="#161b22" stroke="#563d7c"/><text y="5" fill="#bc8cff">CSS</text></g>
      <g transform="translate(-157 -97)"><rect x="-40" y="-18" width="80" height="36" rx="18" fill="#161b22" stroke="#3572a5"/><text y="5" fill="#79c0ff">Python</text></g>
      <g transform="translate(157 -97)"><rect x="-34" y="-18" width="68" height="36" rx="18" fill="#161b22" stroke="#b07219"/><text y="5" fill="#ffa657">Java</text></g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="38s" repeatCount="indefinite"/>
    </g>
    <g fill="#ff3655" filter="url(#g)">
      <circle cx="220" cy="0" r="4"><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="9s" repeatCount="indefinite"/></circle>
      <circle cx="-220" cy="0" r="3"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="7s" repeatCount="indefinite"/></circle>
    </g>
  </g>
</svg>
