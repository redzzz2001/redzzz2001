<svg xmlns="http://www.w3.org/2000/svg" width="580" height="174" viewBox="0 0 580 174" role="img" aria-label="Terminal com frases animadas">
<!--
  EDITE SOMENTE AS FRASES NOS 3 ELEMENTOS <text> ABAIXO.
  Limite: 35 caracteres por frase. Para adicionar/remover frases,
  e preciso ajustar a duracao e os atrasos da animacao.
  Nao precisa de GIF, GitHub Actions ou scripts externos.
-->
<style>
  .typing { animation: typing 21s steps(35,end) infinite; }
  .second { animation-delay: -14s; }
  .third { animation-delay: -7s; }
  @keyframes typing {
    0% { width: 0px; }
    14.2857% { width: 316px; }
    22% { width: 316px; }
    31% { width: 0px; }
    33.3333%, 100% { width: 0px; }
  }
  .cursor { animation: blink 1s steps(1,end) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
</style>
<defs>
  <clipPath id="clip1"><rect class="typing" width="0" height="25"/></clipPath>
  <clipPath id="clip2"><rect class="typing second" width="0" height="25"/></clipPath>
  <clipPath id="clip3"><rect class="typing third" width="0" height="25"/></clipPath>
</defs>
<rect x="1" y="1" width="578" height="172" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
<path d="M15 1 H565 Q579 1 579 15 V43 H1 V15 Q1 1 15 1" fill="#161b22"/>
<path d="M1 43 H579" stroke="#30363d"/>
<circle cx="22" cy="22" r="6" fill="#ff5f57"/>
<circle cx="43" cy="22" r="6" fill="#febc2e"/>
<circle cx="64" cy="22" r="6" fill="#28c840"/>
<text x="290" y="27" font-size="13" fill="#8b949e" font-family="monospace" text-anchor="middle">redzzz@terminal</text>
<text x="22" y="104" font-size="15" font-family="monospace" fill="#e6edf3"><tspan fill="#7ee787">redzzz@PC-do-nick</tspan><tspan>:~$ </tspan></text>
<!-- ===== FRASES EDITAVEIS: ALTERE APENAS O TEXTO ===== -->
<g transform="translate(211 85)" clip-path="url(#clip1)">
  <text x="0" y="19" font-family="monospace" font-size="15" fill="#e6edf3">esperando o Codex resetar...</text>
</g>
<g transform="translate(211 85)" clip-path="url(#clip2)">
  <text x="0" y="19" font-family="monospace" font-size="15" fill="#e6edf3">hello world("print")</text>
</g>
<g transform="translate(211 85)" clip-path="url(#clip3)">
  <text x="0" y="19" font-family="monospace" font-size="15" fill="#e6edf3">frase 3 sla</text>
</g>
<!-- ===== FIM DAS FRASES ===== -->
<rect class="cursor" x="211" y="90" width="8" height="18" fill="#e6edf3"/>
</svg>
